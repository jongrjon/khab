<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Candy body -->
  <rect x="14" y="20" width="36" height="24" rx="6" fill="#a52417"/>
  <!-- Left twist -->
  <polygon points="14,26 4,20 4,44 14,38" fill="#a52417"/>
  <!-- Right twist -->
  <polygon points="50,26 60,20 60,44 50,38" fill="#a52417"/>
  <!-- Circuit traces -->
  <line x1="20" y1="32" x2="28" y2="32" stroke="white" stroke-width="2"/>
  <line x1="28" y1="32" x2="28" y2="26" stroke="white" stroke-width="2"/>
  <line x1="28" y1="32" x2="36" y2="32" stroke="white" stroke-width="2"/>
  <line x1="36" y1="32" x2="36" y2="38" stroke="white" stroke-width="2"/>
  <line x1="36" y1="32" x2="44" y2="32" stroke="white" stroke-width="2"/>
  <!-- Solder dots -->
  <circle cx="20" cy="32" r="3" fill="white"/>
  <circle cx="28" cy="26" r="3" fill="white"/>
  <circle cx="36" cy="38" r="3" fill="white"/>
  <circle cx="44" cy="32" r="3" fill="white"/>
</svg>
