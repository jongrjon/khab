# KHA Boutique — nginx location blocks
#
# These replace the khab-related blocks in /etc/nginx/sites-enabled/khab
# The server block and other apps (stofur, examdata) stay unchanged.
#
# CHANGE SUMMARY vs old config:
#   - proxy_pass: unix socket → http://127.0.0.1:8000 (Docker)
#   - /static: /var/www/khab/static/ → project staticfiles/
#   - /media: /var/www/khab/media/ → project media/
#   - removed /templates (not needed)
#
# Replace the location / , /static, /media, /templates blocks with:

  location / {
    proxy_pass              http://127.0.0.1:8000;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
  }

  location /static/ {
    alias /var/www/khab/staticfiles/;
    expires 30d;
  }

  location /media/ {
    alias /var/www/khab/media/;
    expires 7d;
  }
