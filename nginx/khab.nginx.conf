# Host nginx config for KHA Boutique.
#
# Deploy to: /etc/nginx/sites-available/khab
# Enable:    sudo ln -sf /etc/nginx/sites-available/khab /etc/nginx/sites-enabled/khab
# Apply:     sudo nginx -t && sudo systemctl reload nginx
#
# scripts/init-server.sh --with-nginx installs this for you (it backs up the
# existing file first).
#
# CHANGES vs the config this replaces:
#   / .......... unix:/run/gunicorn.sock  ->  http://127.0.0.1:8000  (Docker)
#   /static .... /var/www/khab/static/    ->  /srv/khab/staticfiles/ (collectstatic output)
#   /media ..... /var/www/khab/media/     ->  /srv/khab/media/
#   /templates . REMOVED — it served the raw Django template directory over
#                HTTP with autoindex on. Nothing needs it and it leaks the
#                app's internals.
#   autoindex .. REMOVED from /static and /media. Directory listings of the
#                media tree expose every staff avatar and product image by URL.
#   /stofur, /examdata/ ... kept byte-for-byte. Both are being retired; delete
#                these two blocks once they have moved.
#
# HTTP only, by design: this is an internal host with no certificate.
# If TLS is added later, add a :443 server block and redirect :80 to it, and
# set CSRF_TRUSTED_ORIGINS=https://<addr> in .env.

access_log                  /var/log/nginx/khab.access.log;
error_log                   /var/log/nginx/khab.error.log;

server {
  # The app is reached by IP, not by a hostname, so there is no name to match
  # on — `_` is the conventional catch-all placeholder. What actually routes
  # traffic here is default_server below.
  server_name               _;

  # default_server is load-bearing: it makes this block answer every request
  # that does not match one of the other sites (jirapi, matsedill, matur,
  # stofur), which is exactly how IP access lands here. Dropping it hands
  # IP traffic to whichever vhost nginx picks first.
  listen                    80 default_server;

  # Note: nginx accepts the request regardless of Host; Django is the one that
  # enforces it. Every address people use must be in ALLOWED_HOSTS or Django
  # returns 400. scripts/prepare-server.sh detects them for you.

  # Product images are uploaded through the admin.
  client_max_body_size      20M;

  location / {
    # __APP_PORT__ is substituted from APP_PORT in .env by
    # scripts/init-server.sh. If you install this file by hand, replace it
    # with the same port docker-compose.prod.yaml publishes.
    proxy_pass              http://127.0.0.1:__APP_PORT__;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
  }

  location /static/ {
    alias                   /srv/khab/staticfiles/;
    expires                 30d;
  }

  location /media/ {
    alias                   /srv/khab/media/;
    expires                 7d;
  }

  # ── Being deprecated; unchanged from the previous config ──────────────────
  location /stofur{
    autoindex on;
    alias /home/jonhelgi/stofur;
  }

  location /examdata/{
    proxy_pass http://unix:/var/www/examdata/examdata.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
