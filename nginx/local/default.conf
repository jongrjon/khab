# Local-dev nginx. Mirrors what the host nginx does in production
# (see khab.conf) so static/ and media/ actually get served locally.
# Used only by docker-compose.override.yml.

server {
  listen 80;
  server_name localhost;
  client_max_body_size 20M;

  location /static/ {
    alias /srv/staticfiles/;
  }

  location /media/ {
    alias /srv/media/;
  }

  location / {
    proxy_pass              http://app:8000;
    # $http_host, not $host: $host strips the :8080 port, so Django's CSRF
    # origin check compares Origin "http://localhost:8080" against host
    # "localhost" and rejects the POST. Prod uses :80/:443 so it never bites.
    proxy_set_header        Host $http_host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
  }
}
